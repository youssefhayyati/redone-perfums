; Local development settings, layered on top of php.ini-development.

; GD decodes the whole photo in memory: an 8000 × 8000 px upload needs about 256 MB.
memory_limit = 512M

; Admin photo uploads accept up to 8 MB (ImageUploadRequest).
upload_max_filesize = 10M
post_max_size = 12M

expose_php = Off

; Cache compiled code but check every request for edits made on the host.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
