# Local development stack: the whole shop with one command.
#
#   docker compose up -d
#
#   http://localhost:8000          storefront (and /admin)
#   http://localhost:8025          Mailpit: every e-mail the app sends lands here
#   localhost:3306                 MySQL, for a database client
#
# First run: copy .env.example to .env and set DB_PASSWORD. Each start, the `setup`
# container installs Composer packages when composer.lock changed, generates APP_KEY
# when empty and migrates (a brand-new database also gets the demo content) before
# the app, queue and scheduler start. Then create a staff account:
#
#   docker compose exec app php artisan app:create-admin
#
# Run any artisan / composer command the same way (`docker compose exec app …`).
# Logs: `docker compose logs -f queue` or storage/logs/laravel.log.
#
# The values below override .env inside the containers: the app reaches MySQL and
# Mailpit by service name, whatever DB_HOST/DB_PORT and MAIL_* say for the host.
# On Linux, set DOCKER_UID / DOCKER_GID in .env to your `id -u` / `id -g`.

x-php: &php
  build:
    context: ./docker/php
    args:
      UID: ${DOCKER_UID:-1000}
      GID: ${DOCKER_GID:-1000}
  image: redone-perfums-php
  restart: unless-stopped
  user: www-data
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
    # Laravel loads ~570 vendor files per request: reading them from a Windows drive
    # takes seconds, from a Docker volume milliseconds. The host's vendor/ folder is
    # only for the editor; refresh it after Composer changes with
    #   docker compose cp app:/var/www/html/vendor .
    - vendor:/var/www/html/vendor
  environment:
    DB_HOST: mysql
    DB_PORT: 3306
    MAIL_MAILER: smtp
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  depends_on:
    setup:
      condition: service_completed_successfully
    mailpit:
      condition: service_started

services:
  # One-shot: dependencies, APP_KEY and migrations (docker/php/setup.sh).
  setup:
    <<: *php
    restart: "no"
    command: ["sh", "docker/php/setup.sh"]
    depends_on:
      mysql:
        condition: service_healthy

  # PHP-FPM, behind nginx.
  app:
    <<: *php

  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - ./storage/app/public:/var/www/html/storage/app/public:ro
    depends_on:
      - app

  # Sends the queued e-mails (order alerts, confirmations, status updates).
  # `queue:listen` reloads the code for every job, so edits apply without a restart.
  queue:
    <<: *php
    command: ["php", "artisan", "queue:listen", "--tries=3", "--timeout=0"]

  # Runs routes/console.php: cart pruning, password-reset cleanup, heartbeat.
  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  # Vite dev server with hot reload (docker/node/dev.sh). LARAVEL_SAIL makes the
  # Laravel plugin listen on all interfaces and point the browser to localhost.
  # File events from a Windows drive do not reach containers, hence the polling;
  # set CHOKIDAR_USEPOLLING=false in .env on Linux or macOS.
  vite:
    image: node:22-alpine
    restart: unless-stopped
    init: true
    working_dir: /var/www/html
    command: ["sh", "docker/node/dev.sh"]
    environment:
      LARAVEL_SAIL: "1"
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      # Milliseconds between checks of each file: edits show within a second, and
      # polling a Windows drive more often keeps a CPU core busy.
      CHOKIDAR_INTERVAL: 1000
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-redone_parfums}
      MYSQL_USER: ${DB_USERNAME:-redone}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting MySQL}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
  vendor:
  node-modules:
